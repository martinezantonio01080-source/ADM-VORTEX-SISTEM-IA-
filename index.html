<div class="weather-container">
    <div class="header-badge">Build with Gemini XPRIZE</div>
    <h2>Atmospheric & Climate AI</h2>
    <p class="subtitle">Real-time regional telemetry & analysis</p>
    
    <div class="input-group">
        <input type="text" id="stateInput" placeholder="State / Region (e.g., Jalisco)">
        <input type="text" id="countryInput" placeholder="Country Code (e.g., MX)">
        <button id="searchBtn" onclick="handleSearch()">Analyze Region</button>
    </div>
    
    <div id="result" class="result-box">
        <div class="placeholder-text">Enter a state and country code to fetch live data.</div>
    </div>
</div>
